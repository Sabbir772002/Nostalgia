{% extends 'base.html' %} 
{% block content%}
{% load static %}   
<link rel="stylesheet" href="{% static 'css/sign.css' %}." />
<style>
  
.GN {
    border-bottom-left-radius: 15px;
    border-top-left-radius: 15px;
    background-color: #392d58;
}
/* above is after add */

@media (min-width: 1025px) {
  .h-custom {
    height: 100vh !important;
  }
}
.card-registration .select-input.form-control[readonly]:not([disabled]) {
  font-size: 1rem;
  line-height: 2.15;
  padding-left: 0.75em;
  padding-right: 0.75em;
}
.card-registration .select-arrow {
  top: 13px;
}

.gradient-custom-2 {
  /* fallback for old browsers */
  background: #ffffff;
}

.bg-indigo {
  background-color: #4835d4;
}
@media (min-width: 992px) {
  .card-registration-2 .bg-indigo {
    border-top-right-radius: 15px;
    border-bottom-right-radius: 15px;
  }
}
@media (max-width: 991px) {
  .card-registration-2 .bg-indigo {
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
  }
}

/*Main code for template
@media (min-width: 1025px) {
    .h-custom {
      height: 100vh !important;
    }
  }
  .card-registration .select-input.form-control[readonly]:not([disabled]) {
    font-size: 1rem;
    line-height: 2.15;
    padding-left: 0.75em;
    padding-right: 0.75em;
  }
  .card-registration .select-arrow {
    top: 13px;
  }

  .gradient-custom-2 {
    /* fallback for old browsers */
    background: #a1c4fd;

    /* Chrome 10-25, Safari 5.1-6 */
    background: -webkit-linear-gradient(
      to right,
      rgba(161, 196, 253, 1),
      rgba(194, 233, 251, 1)
    );

    /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
    background: linear-gradient(
      to right,
      rgba(161, 196, 253, 1),
      rgba(194, 233, 251, 1)
    );
  }

  .bg-indigo {
    background-color: #4835d4;
  }
  @media (min-width: 992px) {
    .card-registration-2 .bg-indigo {
      border-top-right-radius: 15px;
      border-bottom-right-radius: 15px;
    }
  }
  @media (max-width: 991px) {
    .card-registration-2 .bg-indigo {
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
    }
  }
</style>

<div class="sinupdone"></div>
  <section class="h-100 h-custom gradient-custom-2">
    <form action="{% url 'signup' %}" class="term" id="term" method="post">
      {% csrf_token %}
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-12">
            <div
              class="card card-registration card-registration-2"
              style="border-radius: 15px"
            >
              <div class="card-body p-0">
                <div class="row g-0">
                  <div class="GN col-lg-6">
                    <div class="p-5">
                      <h3 class="fw-normal mb-5" style="color: #ffffff">
                        General Infomation
                      </h3>

                      <div class="row">
                        <div class="row">
                          <div class="col-md-6 mb-4 pb-2">
                            <div class="form-outline">
                              <input type="text" id="id_first_name" name="first_name" class="form-control form-control-lg" />
                              <label class="form-label" for="id_first_name">First name</label>
                            </div>
                          </div>
    
                        <div class="col-md-6 mb-4 pb-2">
                          <div class="form-outline">
                            <!-- <input type="text" id="form3Examplev3" class="form-control form-control-lg" /> -->
                            <input type="text" id="id_last_name" name="last_name" class="form-control form-control-lg" />
                            <label class="form-label" for="id_last_name"
                              >Last name</label
                            >
                          </div>
                        </div>
                      </div>

                      <div class="mb-4 pb-2">
                        <div class="form-outline">
                          <input type="text" id="id_username" name="username" class="form-control form-control-lg" />
                          <!-- <input type="text" id="form3Examplev4" class="form-control form-control-lg" />
     -->
                          <label class="form-label" for="id_username"
                            >Username</label>
                            
                        </div>
                      </div>

                      <div class="mb-4 pb-2">
                        <div class="form-outline">
                              <input type="text" id="id_username" name="password" class="form-control form-control-lg" />

                          <label class="form-label" for="id_username"
                            >Password</label
                          >
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="col-lg-6 bg-indigo text-white">
                    <div class="p-5">
                      <h3 class="fw-normal mb-5">Contact Details</h3>

                      <div class="mb-4 pb-2">
                        <div class="form-outline form-white">
                          <input type="text" id="id_address" name="address" class="form-control form-control-lg" />

                          <!-- <input type="text" id="form3Examplea2" class="form-control form-control-lg" />
     -->
                          <label class="form-label" for="id_address"
                            >Address</label
                          >
                        </div>
                      </div>

                      <div class="mb-4 pb-2">
                        <div class="form-outline form-white">
                          <input type="text" id="id_phone" name="phone" class="form-control form-control-lg" />

                          <!--   <input type="text" id="form3Examplea3" class="form-control form-control-lg" />
   -->
                          <label class="form-label" for="id_phone"
                            >Phone</label
                          >
                        </div>
                      </div>

                      <div class="row">
                        <div class="col-md-5 mb-4 pb-2">
                          <div class="form-outline form-white">
                            <input type="text" id="id_thana" name="thana" class="form-control form-control-lg" />

                            <!--   <input type="text" id="form3Examplea4" class="form-control form-control-lg" />
   -->
                            <label class="form-label" for="form3Examplea4"
                              >Thana</label
                            >
                          </div>
                        </div>
                        <div class="col-md-7 mb-4 pb-2">
                          <div class="form-outline form-white">
                            <input type="text" id="id_district" name="district" class="form-control form-control-lg" />

                            <!--  <input type="text" id="form3Examplea5" class="form-control form-control-lg" />
    -->
                            <label class="form-label" for="form3Examplea5"
                              >District</label
                            >
                          </div>
                        </div>
                      </div>

                      <div class="mb-4 pb-2">
                        <div class="form-outline form-white">
                          <input type="text" id="id_division" name="division" class="form-control form-control-lg" />

                          <!--  <input type="text" id="form3Examplea6" class="form-control form-control-lg" />
    -->
                          <label class="form-label" for="form3Examplea6"
                            >Division</label
                          >
                        </div>
                      </div>

                      <div class="mb-4">
                        <div class="form-outline form-white">
                          <input type="text" id="id_email" name="email" class="form-control form-control-lg" />

                          <!-- <input type="text" id="form3Examplea9" class="form-control form-control-lg" />
     -->
                          <label class="form-label" for="form3Examplea9">
                            Email</label
                          >
                        </div>
                      </div>
                     

                      <div class="mb-4">
                        <div class="form-outline form-white">
                          <label
                            class="form-label text-white"
                            for="form3Examplea9"
                          >
                            Gender :</label
                          >
                          <input type="text" id="id_gender" name="gender" class="form-control form-control-lg" />
                          <!-- <input type="text" id="form3Examplea9" class="form-control form-control-lg" /> -->
                        </div>
                      </div>

                      <div class="mb-4">
                        <div class="form-outline form-white">
                          <!-- <input type="text" id="form3Examplea9" class="form-control form-control-lg" />
     -->
                          <label
                            class="form-label text-white"
                            for="form3Examplea9"
                          >
                            Birthdate:</label
                          >
                          <input type="text" id="id_dob" name="dob" class="form-control form-control-lg" />
                        </div>
                      </div>

                      <div
                        class="form-check d-flex justify-content-start mb-4 pb-3"
                      >
                        <input
                          class="form-check-input me-3"
                          type="checkbox"
                          value=""
                          id="form2Example3c"
                        />
                        <label
                          class="form-check-label text-white"
                          for="form2Example3"
                        >
                          I do accept the
                          <a href="#!" class="text-white"
                            ><u>Terms and Conditions</u></a
                          >
                          of your site.
                        </label>
                      </div>
                      <div>
                        <button
                          type="submit"
                          id="submit"
                          class="btn btn-light btn-lg"
                          data-mdb-ripple-color="dark"
                        >
                          Register
                        </button>
                        <a
                          href="{%url 'login'%}"
                          class="text-white fw-bold text-body text-white"
                          ><u class="'text-white">Login here</u></a
                        >
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </section>
</div>
{%endblock%}
